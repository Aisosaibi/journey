name: Daily fade

on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC = 03:00 in Lagos
  workflow_dispatch:

permissions:
  issues: write

jobs:
  fade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const LABEL = "daily";
            const MAX_DAYS = 3;
            const DRY_RUN = true; // change to false once the log looks right

            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, labels: LABEL, state: "open", per_page: 100,
            });

            for (const issue of issues) {
              if (issue.pull_request) continue;

              const events = await github.paginate(github.rest.issues.listEvents, {
                owner, repo, issue_number: issue.number, per_page: 100,
              });
              const labeled = events.filter(
                (e) => e.event === "labeled" && e.label && e.label.name === LABEL
              );
              if (labeled.length === 0) {
                core.info(`#${issue.number}: no label event found, skipped`);
                continue;
              }
              const since = new Date(labeled[labeled.length - 1].created_at);
              const days = (Date.now() - since.getTime()) / 86400000;

              if (days <= MAX_DAYS) {
                core.info(`#${issue.number}: ${days.toFixed(1)} days on ${LABEL}, kept`);
                continue;
              }
              if (DRY_RUN) {
                core.info(`#${issue.number}: ${days.toFixed(1)} days, WOULD close as not planned`);
                continue;
              }
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `Dropped: on \`${LABEL}\` for more than ${MAX_DAYS} days. Closed as not planned. This was not done.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number,
                state: "closed", state_reason: "not_planned",
              });
              core.info(`#${issue.number}: closed as not planned`);
            }
